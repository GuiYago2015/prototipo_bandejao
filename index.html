  <style>

    body { background: #faf9f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }

  </style>
  <noscript>
    <style>#__bundler_loading { display: none; }</style>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">

<body>
  <div id="__bundler_placeholder">Loading Totem Bandejão...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 12px; padding: 16px; box-shadow: {{readerGlow}}\">\n<div style=\"width: 118px; height: 118px; border-radius: 50%; border: 4px solid {{readerRing}}; display: flex; align-items: center; justify-content: center\">\n<svg width=\"64\" height=\"64\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.6\" stroke-linecap=\"round\" aria-hidden=\"true\"><rect x=\"4\" y=\"7\" width=\"10\" height=\"7\" rx=\"1.5\"><\u002Frect><path d=\"M17 7.5a5 5 0 0 1 0 6M19.5 5.5a8 8 0 0 1 0 10\"><\u002Fpath><\u002Fsvg>\n<\u002Fdiv>\n<span style=\"font-size: 18px; font-weight: 700; text-align: center\">Leitor da<br>carteirinha<\u002Fspan>\n<span aria-hidden=\"true\" style=\"font-size: 16px; letter-spacing: 1px\">⠇⠑⠊⠞⠕⠗<\u002Fspan>\n<span style=\"font-size: 13px; color: #B8C4D3\">{{readerHint}}<\u002Fspan>\n<\u002Fbutton>\n<\u002Fdiv>\n\n<!-- MAQUININHA + FONE -->\n<div style=\"width: 100%; display: flex; gap: 22px; align-items: center\">\n<button class=\"hw\" sc-camel-on-click=\"{{tapMachine}}\" aria-label=\"Aproximar cartão na maquininha\" style=\"flex: 1; background: #12181F; border-radius: 18px; padding: 16px 20px; display: flex; align-items: center; gap: 18px; box-shadow: {{machineGlow}}\">\n<div style=\"width: 190px; height: 74px; border-radius: 8px; background: #9FD3B0; color: #0B2A16; font-family: ui-monospace, monospace; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-align: center; padding: 6px; box-sizing: border-box; white-space: pre-line\">{{machineTxt}}<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; align-items: flex-start; gap: 6px; color: #fff\">\n<span style=\"font-size: 20px; font-weight: 700\">Maquininha<\u002Fspan>\n<span aria-hidden=\"true\" style=\"font-size: 16px; letter-spacing: 1px\">⠉⠁⠗⠞⠁⠕<\u002Fspan>\n<span style=\"font-size: 14px; color: #B8C4D3; text-align: left\">Aproxime ou insira o cartão<br>Débito · Crédito<\u002Fspan>\n<\u002Fdiv>\n<svg width=\"48\" height=\"48\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"1.6\" stroke-linecap=\"round\" aria-hidden=\"true\" style=\"margin-left: auto\"><path d=\"M8.5 7a7 7 0 0 1 0 10M12 5a10 10 0 0 1 0 14M15.5 3a13 13 0 0 1 0 18\"><\u002Fpath><\u002Fsvg>\n<\u002Fbutton>\n<div style=\"width: 170px; display: flex; flex-direction: column; align-items: center; gap: 6px; color: #fff\">\n<div style=\"display: flex; align-items: center; gap: 8px\">\n<div style=\"width: 28px; height: 28px; border-radius: 50%; background: #0F1620; border: 4px solid #5B6B7E; box-sizing: border-box; flex: none\"><\u002Fdiv>\n<span style=\"font-size: 14px; line-height: 1.2; text-align: left\">Entrada para fone<br><span style=\"color: #B8C4D3\">voz só no seu ouvido<\u002Fspan><\u002Fspan>\n<\u002Fdiv>\n<div style=\"width: 100%; height: 1px; background: #2B3846\"><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; align-items: center; gap: 3px; width: 100%\">\n<div style=\"position: relative; width: 130px; height: 12px; border-radius: 6px; background: #0B0F14; box-shadow: {{receiptGlow}}\"><div style=\"position: absolute; left: 14px; right: 14px; top: 2px; height: 8px; border-radius: 2px; background: {{paperBg}}\"><\u002Fdiv><\u002Fdiv>\n<span style=\"font-size: 14px; font-weight: 700\">{{receiptLbl}}<\u002Fspan>\n<span aria-hidden=\"true\" style=\"font-size: 13px; letter-spacing: 1px\">⠉⠕⠍⠏⠗⠕⠧⠁⠝⠞⠑<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<!-- base -->\n<div style=\"width: 300px; height: 70px; background: #17202B; border-radius: 0 0 14px 14px\"><\u002Fdiv>\n<div style=\"width: 520px; height: 26px; background: #121922; border-radius: 12px\"><\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ============ PAINEL LATERAL ============ -->\n<div style=\"flex: 1; display: flex; flex-direction: column; gap: 22px; padding-top: 8px\">\n<div>\n<div style=\"font-size: 15px; font-weight: 700; color: #0B4EA2; letter-spacing: 1px\">TP1 · IHC · PROTÓTIPO DE ALTA FIDELIDADE<\u002Fdiv>\n<h1 style=\"font-size: 44px; margin: 8px 0 0; line-height: 1.05\">Totem Bandejão<\u002Fh1>\n<p style=\"font-size: 19px; margin: 10px 0 0; line-height: 1.4; color: #3D4F66\">Um totem, uma carteirinha: saldo, recarga, transferência, cardápio e avaliação, sem precisar do celular.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"background: #fff; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 12px\">\n<div style=\"font-size: 20px; font-weight: 700\">Como usar o protótipo<\u002Fdiv>\n<div style=\"font-size: 17px; line-height: 1.45; color: #22344D\">Clique nas peças do totem como se estivesse na frente dele:<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 10px; font-size: 17px; line-height: 1.4\">\n<div><b>Leitor da carteirinha<\u002Fb>: clique para “encostar” a carteirinha. Na transferência, o segundo clique é a carteirinha do colega.<\u002Fdiv>\n<div><b>Tela<\u002Fb>: toque nos botões normalmente.<\u002Fdiv>\n<div><b>Teclado<\u002Fb>: números para valores e notas (1 a 5); ▲ ▼ e OK para andar pelos menus sem tocar na tela; Confirmar, Corrigir, Cancelar e Repetir áudio. Todas as teclas, o leitor e a maquininha têm braile em relevo, e cada ação também tem uma cor e um formato diferentes.<\u002Fdiv>\n<div><b>Maquininha<\u002Fb>: clique para “aproximar” o cartão quando ela piscar em azul.<\u002Fdiv>\n<div><b>Saída do comprovante<\u002Fb>: depois de recarregar ou transferir, o papel sai ao lado da maquininha.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"background: #fff; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 10px\">\n<div style=\"font-size: 20px; font-weight: 700\">Cenário para testar<\u002Fdiv>\n<ol style=\"margin: 0; padding-left: 22px; font-size: 17px; line-height: 1.5; color: #22344D\">\n<li>Encoste a carteirinha do Lucas (saldo R$ 1,50).<\u002Fli>\n<li>Recarregue R$ 20 com o cartão na maquininha.<\u002Fli>\n<li>Transfira R$ 7 para a Mariana: digite 7, Confirmar, encoste a carteirinha dela e confirme.<\u002Fli>\n<li>Entre de novo e avalie o almoço com nota 4 pelo teclado.<\u002Fli>\n<li>Teste sem tocar na tela: entre e vá até Cardápio com ▼ e OK.<\u002Fli>\n<\u002Fol>\n<button sc-camel-on-click=\"{{reset}}\" style=\"align-self: flex-start; min-height: 44px; border: 2px solid #0B4EA2; background: transparent; color: #0B4EA2; border-radius: 10px; font-size: 16px; font-weight: 700; padding: 0 16px\">Reiniciar demonstração<\u002Fbutton>\n<\u002Fdiv>\n\n<div style=\"background: #fff; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 10px\">\n<div style=\"font-size: 20px; font-weight: 700\">Onde ficam os totens<\u002Fdiv>\n<div style=\"font-size: 17px; line-height: 1.45; color: #22344D\">Campus Nova Gameleira, 2 unidades: na entrada do bandejão e no prédio principal, junto aos caixas eletrônicos. Refeição: R$ 3,90.<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"background: #fff; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 10px\">\n<div style=\"font-size: 20px; font-weight: 700\">Luz de status<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 8px; font-size: 17px\">\n<div style=\"display: flex; align-items: center; gap: 10px\"><span style=\"width: 36px; height: 10px; border-radius: 5px; background: #3E8BFF\"><\u002Fspan>Azul: esperando você (carteirinha ou cartão)<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 10px\"><span style=\"width: 36px; height: 10px; border-radius: 5px; background: #2ECC71\"><\u002Fspan>Verde: deu certo<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 10px\"><span style=\"width: 36px; height: 10px; border-radius: 5px; background: #FF9F1C\"><\u002Fspan>Laranja: atenção, confira a mensagem<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1140,&quot;height&quot;:1760}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = this.initial();\n  }\n  initial() {\n    return { screen: 'espera', logged: false, bal: 1.5, val: '', amt: 0, method: '', err: '', led: 'blue', hc: false, tab: 'hoje', rating: 0, cat: '', mood: '', anon: false, audio: 'Bem-vindo ao Bandejão. Encoste sua carteirinha no leitor.', lastAudio: '', countdown: 0, idle: 0 };\n  }\n  componentDidMount() {\n    this.lastAct = Date.now();\n    this.iv = setInterval(() => this.tick(), 1000);\n    this.fi = -1; this.fscreen = this.state.screen;\n    this.mo = new MutationObserver(() => this.paintFocus());\n    this.mo.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['class'] });\n  }\n  componentWillUnmount() { clearInterval(this.iv); if (this.mo) this.mo.disconnect(); }\n  touch() { this.lastAct = Date.now(); }\n  focusables() { return Array.from(document.querySelectorAll('.scr .body button')).filter((b) => b.offsetParent !== null); }\n  btnText(b) { return (b.innerText || b.textContent || '').replace(/\\s+/g, ' ').trim(); }\n  paintFocus() {\n    const list = this.fi >= 0 && this.fscreen === this.state.screen ? this.focusables() : [];\n    const on = list[this.fi] || null;\n    document.querySelectorAll('.kfocus').forEach((e) => { if (e !== on) e.classList.remove('kfocus'); });\n    if (on && !on.classList.contains('kfocus')) on.classList.add('kfocus');\n  }\n  nav(dir) {\n    const s = this.state;\n    const list = this.focusables();\n    if (!list.length) { this.setState({ audio: 'Não há opções para escolher nesta tela.' }); return; }\n    const first = this.fi < 0;\n    let i = this.fi;\n    if (first) i = dir > 0 ? 0 : list.length - 1; else i = (i + dir + list.length) % list.length;\n    this.fi = i; this.fscreen = s.screen;\n    this.paintFocus();\n    let txt = this.btnText(list[i]);\n    if (s.screen === 'avaliar') txt = txt.replace(/^(\\d) (\\S+)$/, 'Nota $1, $2');\n    this.setState({ audio: 'Opção ' + (i + 1) + ' de ' + list.length + ': ' + txt + '.' + (first ? ' Aperte OK para escolher.' : '') });\n  }\n  okSel() {\n    const s = this.state;\n    if (this.fi < 0 || this.fscreen !== s.screen) { this.setState({ audio: 'Use as setas para escolher uma opção e aperte OK.' }); return; }\n    const b = this.focusables()[this.fi];\n    if (!b) { this.setState({ audio: 'Use as setas para escolher uma opção e aperte OK.' }); return; }\n    b.click();\n  }\n  tick() {\n    const s = this.state;\n    if (!s.logged) return;\n    if (s.screen === 'recOk' || s.screen === 'transfOk' || s.screen === 'obrigado') {\n      const c = s.countdown - 1;\n      if (c <= 0) { this.go('espera', 'Sessão encerrada automaticamente. Até logo!', { logged: false, led: 'blue', val: '', rating: 0, cat: '', mood: '', countdown: 0 }); }\n      else this.setState({ countdown: c });\n      return;\n    }\n    const idle = Math.floor((Date.now() - (this.lastAct || Date.now())) / 1000);\n    if (idle >= 60) { this.go('espera', 'Sessão encerrada por falta de uso. Nada foi alterado.', { logged: false, led: 'blue', val: '', rating: 0, countdown: 0, idle: 0 }); return; }\n    if (idle !== s.idle) this.setState({ idle: idle });\n  }\n  fmt(v) { return 'R$ ' + v.toFixed(2).replace('.', ','); }\n  say(t) { return { audio: t }; }\n  go(screen, audio, extra) {\n    this.lastAct = Date.now();\n    const done = screen === 'recOk' || screen === 'transfOk' || screen === 'obrigado';\n    this.setState(Object.assign({ countdown: done ? 20 : 0, idle: 0 }, extra || {}));\n    this.fi = -1; this.fscreen = screen;\n    this.setState(Object.assign({ screen: screen, err: '', audio: audio || this.state.audio }, extra || {}));\n  }\n  home() { this.go('inicio', 'Menu principal. Seu saldo é ' + this.fmt(this.state.bal) + '.', { led: 'green', val: '' }); }\n  logout() { this.go('espera', 'Sessão encerrada. Até logo!', { logged: false, led: 'blue', val: '', rating: 0, cat: '', mood: '' }); }\n  digit(d) {\n    const s = this.state;\n    if (s.screen === 'recOutro' || s.screen === 'transfValor') {\n      if (s.val.length >= 3) return;\n      const v = (s.val + d).replace(/^0+/, '');\n      this.setState({ val: v, err: '', audio: 'R$ ' + (v || '0') });\n    } else if (s.screen === 'avaliar') {\n      const n = parseInt(d, 10);\n      if (n >= 1 && n <= 5) this.setState({ rating: n, audio: 'Nota ' + n + '. Aperte Confirmar para enviar.' });\n      else this.setState({ audio: 'Use as teclas de 1 a 5.' });\n    } else {\n      this.setState({ audio: 'Nesta tela, use as setas e OK para escolher. O teclado de números serve para valores e notas.' });\n    }\n  }\n  fix() {\n    const s = this.state;\n    if (s.screen === 'recOutro' || s.screen === 'transfValor') this.setState({ val: s.val.slice(0, -1), err: '', audio: 'Último número apagado.' });\n    else if (s.screen === 'avaliar') this.setState({ rating: 0, audio: 'Nota apagada.' });\n  }\n  cancel() {\n    const s = this.state;\n    if (!s.logged) { this.go('espera', 'Encoste sua carteirinha no leitor.', { led: 'blue' }); return; }\n    if (s.screen === 'inicio') { this.logout(); return; }\n    this.go('inicio', 'Operação cancelada. Nada foi cobrado.', { led: 'green', val: '' });\n  }\n  confirm() {\n    const s = this.state;\n    const v = parseInt(s.val || '0', 10);\n    if (s.screen === 'recOutro') {\n      if (v < 5) { this.setState({ err: 'O valor mínimo é R$ 5,00.', led: 'orange', audio: 'Valor abaixo do mínimo de cinco reais.' }); return; }\n      this.go('recForma', 'Recarga de ' + this.fmt(v) + '. Escolha cartão ou Pix.', { amt: v, led: 'green' });\n    } else if (s.screen === 'transfValor') {\n      if (v <= 0) { this.setState({ err: 'Digite um valor para transferir.', led: 'orange', audio: 'Digite um valor.' }); return; }\n      if (v > s.bal) { this.setState({ err: 'Saldo insuficiente. Você tem ' + this.fmt(s.bal) + '.', led: 'orange', audio: 'Saldo insuficiente.' }); return; }\n      this.go('transfColega', 'Agora o colega deve encostar a carteirinha no leitor.', { amt: v, led: 'blue' });\n    } else if (s.screen === 'transfConf') {\n      this.go('transfOk', 'Transferência de ' + this.fmt(s.amt) + ' para Mariana Souza concluída. Seu comprovante saiu ao lado da maquininha.', { bal: s.bal - s.amt, led: 'green' });\n    } else if (s.screen === 'avaliar') {\n      if (!s.rating) { this.setState({ audio: 'Escolha uma nota de 1 a 5 antes de enviar.', led: 'orange' }); return; }\n      this.go('obrigado', 'Nota ' + s.rating + ' enviada. Obrigado!', { led: 'green' });\n    } else if (s.screen === 'feedback') {\n      if (!s.cat || !s.mood) { this.setState({ err: 'Escolha o assunto e se está bom ou precisa melhorar.', led: 'orange', audio: 'Escolha o assunto e a opinião.' }); return; }\n      this.go('obrigado', 'Sugestão enviada. Obrigado!', { led: 'green' });\n    } else {\n      this.setState({ audio: 'Nada para confirmar nesta tela.' });\n    }\n  }\n  tapCard() {\n    const s = this.state;\n    if (s.screen === 'espera' || (!s.logged && s.screen === 'menu')) {\n      this.go('inicio', 'Olá, Lucas. Seu saldo é ' + this.fmt(s.bal) + '.', { logged: true, led: 'green' });\n    } else if (s.screen === 'transfColega') {\n      this.go('transfConf', 'Carteirinha de Mariana Souza. Deseja transferir ' + this.fmt(s.amt) + '? Aperte Confirmar.', { led: 'blue' });\n    } else {\n      this.setState({ audio: 'Você já está identificado como Lucas.' });\n    }\n  }\n  tapMachine() {\n    const s = this.state;\n    if (s.screen === 'pagCartao') {\n      this.go('recOk', 'Pagamento aprovado. Novo saldo: ' + this.fmt(s.bal + s.amt) + '. Seu comprovante saiu ao lado da maquininha.', { bal: s.bal + s.amt, led: 'green', method: 'cartao' });\n    } else {\n      this.setState({ audio: 'A maquininha só é usada na recarga com cartão.' });\n    }\n  }\n  renderVals() {\n    const s = this.state, sc = s.screen;\n    const ledMap = { blue: ['#3E8BFF', 'Aguardando'], green: ['#2ECC71', 'Tudo certo'], orange: ['#FF9F1C', 'Atenção'] };\n    const led = ledMap[s.led] || ledMap.blue;\n    const readerOn = sc === 'espera' || sc === 'transfColega';\n    const machineOn = sc === 'pagCartao';\n    const keypadOn = sc === 'recOutro' || sc === 'transfValor' || sc === 'avaliar' || sc === 'transfConf';\n    const glow = '0 0 0 4px #3E8BFF, 0 0 28px #3E8BFF';\n    const brMap = { '1':'⠁','2':'⠃','3':'⠉','4':'⠙','5':'⠑','6':'⠋','7':'⠛','8':'⠓','9':'⠊','0':'⠚' };\n    const navOn = ['espera', 'pagCartao', 'transfColega', 'recOutro', 'transfConf'].indexOf(sc) < 0;\n    const keyDefs = ['1','2','3','4','5','6','7','8','9','UP','0','DOWN'];\n    const keys = keyDefs.map((k) => {\n      if (k === 'UP' || k === 'DOWN') {\n        const up = k === 'UP';\n        return { label: up ? '▲' : '▼', br: up ? '⠎⠕⠃⠑' : '⠙⠑⠎⠉⠑', aria: up ? 'Seta para cima: opção anterior' : 'Seta para baixo: próxima opção', vis: 'visible', cls: navOn ? 'nav navon' : 'nav', press: () => this.nav(up ? -1 : 1) };\n      }\n      return { label: k, br: '⠼' + brMap[k], aria: 'Tecla ' + k, vis: 'visible', cls: '', press: () => this.digit(k) };\n    });\n    const labels = ['Ruim', 'Fraco', 'Ok', 'Bom', 'Ótimo'];\n    const stars = labels.map((l, i) => ({ n: i + 1, l: l, cls: s.rating === i + 1 ? 'on' : '', pick: () => this.setState({ rating: i + 1, audio: 'Nota ' + (i + 1) + ', ' + l + '.' }) }));\n    const catNames = ['Fila', 'Limpeza', 'Atendimento', 'Variedade', 'Temperatura', 'Estrutura'];\n    const cats = catNames.map((c) => ({ l: c, cls: s.cat === c ? 'on' : '', pick: () => this.setState({ cat: c, err: '', audio: 'Assunto: ' + c + '.' }) }));\n    const today = [\n      { k: 'Prato principal', v: 'Sobrecoxa de frango ao sugo' },\n      { k: 'Vegetariano', v: 'Bolinho de grão-de-bico' },\n      { k: 'Vegano', v: 'Feijão roxo ao vinagrete' },\n      { k: 'Guarnição', v: 'Salpicão' },\n      { k: 'Arroz e feijão', v: 'Arroz branco · Feijão carioca' },\n      { k: 'Saladas', v: 'Alface roxa, tomate c/ orégano, moranga, tabule de frutas' },\n      { k: 'Sobremesa', v: 'Melão' }\n    ];\n    const week = [\n      { d: 'Seg 26/10', p: 'Linguiça de pernil acebolada', v: 'Veg.: hambúrguer de feijão branco · Vegano: soja ao molho rotty' },\n      { d: 'Ter 27/10', p: 'Espetinho de frango na chapa', v: 'Veg.: bolinho de legumes · Vegano: feijão branco ao molho pizzaiolo' },\n      { d: 'Qua 28/10', p: 'Feriado: restaurante fechado', v: 'Sem refeição' },\n      { d: 'Qui 29/10', p: 'Cubos suínos ao molho barbecue', v: 'Veg.: ovo frito · Vegano: cuscuz marroquino' },\n      { d: 'Sex 30/10', p: 'Sobrecoxa de frango ao sugo', v: 'Veg.: bolinho de grão-de-bico · Vegano: feijão roxo ao vinagrete' }\n    ];\n    const qr = [];\n    for (let y = 0; y < 21; y++) for (let x = 0; x < 21; x++) {\n      const inF = (fx, fy) => x >= fx && x < fx + 7 && y >= fy && y < fy + 7;\n      let on;\n      const f = inF(0, 0) ? [0, 0] : inF(14, 0) ? [14, 0] : inF(0, 14) ? [0, 14] : null;\n      if (f) { const dx = x - f[0], dy = y - f[1]; on = dx === 0 || dy === 0 || dx === 6 || dy === 6 || (dx >= 2 && dx <= 4 && dy >= 2 && dy <= 4); }\n      else on = ((x * 7 + y * 13 + x * y) % 5) < 2;\n      qr.push({ bg: on ? '#000' : '#fff' });\n    }\n    const v = parseInt(s.val || '0', 10);\n    const quick = (vals, scr) => vals.map((n) => ({ label: 'R$ ' + n, pick: () => {\n      if (scr === 'rec') this.go('recForma', 'Recarga de ' + this.fmt(n) + '. Escolha cartão ou Pix.', { amt: n, led: 'green' });\n      else this.setState({ val: String(n), err: '', audio: 'R$ ' + n + '. Aperte Continuar ou Confirmar.' });\n    } }));\n    const machineTxt = machineOn ? this.fmt(s.amt) + '\\nAPROXIME' : (sc === 'recOk' && s.method === 'cartao' ? 'APROVADO' : 'BANDEJÃO');\n    return {\n      themeClass: s.hc ? 'hc' : '',\n      logged: s.logged, notLogged: !s.logged,\n      userName: 'Lucas Almeida', firstName: 'Lucas',\n      balTxt: this.fmt(s.bal), mealTxt: 'R$ 3,90', lowBal: s.bal < 3.9,\n      amtTxt: this.fmt(s.amt), afterTxt: this.fmt(s.bal - s.amt),\n      valShow: v ? v + ',00' : '0,00',\n      err: s.err, hasErr: !!s.err,\n      audio: s.audio,\n      ledColor: led[0], ledGlow: led[0], ledLabel: led[1],\n      readerGlow: readerOn ? glow : 'none', readerRing: readerOn ? '#3E8BFF' : '#5B6B7E',\n      readerHint: readerOn ? 'Encoste aqui' : 'Carteirinha lida',\n      machineGlow: machineOn ? glow : 'none', machineTxt: machineTxt,\n      keypadGlow: keypadOn ? glow : 'none',\n      receiptGlow: (sc === 'recOk' || sc === 'transfOk') ? '0 0 0 3px #2ECC71, 0 0 16px #2ECC71' : 'none',\n      paperBg: (sc === 'recOk' || sc === 'transfOk') ? '#fff' : 'transparent',\n      receiptLbl: (sc === 'recOk' || sc === 'transfOk') ? 'Pegue o comprovante' : 'Comprovante',\n      keys: keys, stars: stars, cats: cats, today: today, week: week, qr: qr,\n      quickRec: quick([10, 20, 50], 'rec'), quickTr: quick([5, 7, 10], 'tr'),\n      sEspera: sc === 'espera', sInicio: sc === 'inicio', sRecarga: sc === 'recarga', sRecOutro: sc === 'recOutro',\n      sRecForma: sc === 'recForma', sPagCartao: sc === 'pagCartao', sPagPix: sc === 'pagPix', sRecOk: sc === 'recOk',\n      sTransfValor: sc === 'transfValor', sTransfColega: sc === 'transfColega', sTransfConf: sc === 'transfConf', sTransfOk: sc === 'transfOk',\n      sMenu: sc === 'menu', sAvaliar: sc === 'avaliar', sFeedback: sc === 'feedback', sObrigado: sc === 'obrigado',\n      showToday: s.tab === 'hoje', showWeek: s.tab === 'semana',\n      tabHoje: s.tab === 'hoje' ? 'on' : '', tabSem: s.tab === 'semana' ? 'on' : '',\n      goodCls: s.mood === 'bom' ? 'on' : '', badCls: s.mood === 'melhorar' ? 'on' : '',\n      anonCls: s.anon ? 'on' : '', anonTxt: s.anon ? 'Enviar anônimo: sim' : 'Enviar anônimo: não',\n      toggleHC: () => this.setState({ hc: !s.hc, audio: s.hc ? 'Alto contraste desligado.' : 'Alto contraste ligado.' }),\n      logout: () => this.logout(),\n      goInicio: () => this.home(),\n      goRecarga: () => this.go('recarga', 'Recarga. Escolha um valor.', { val: '', led: 'green' }),\n      goRecOutro: () => this.go('recOutro', 'Digite o valor no teclado numérico e aperte Confirmar.', { val: '' }),\n      goRecForma: () => this.go('recForma', 'Escolha cartão ou Pix.', { led: 'green' }),\n      payCard: () => this.go('pagCartao', 'Aproxime o cartão na maquininha, abaixo do teclado.', { led: 'blue' }),\n      payPix: () => this.go('pagPix', 'Leia o QR Code com o aplicativo do seu banco.', { led: 'blue' }),\n      pixPaid: () => this.go('recOk', 'Pix recebido. Novo saldo: ' + this.fmt(s.bal + s.amt) + '. Seu comprovante saiu ao lado da maquininha.', { bal: s.bal + s.amt, led: 'green', method: 'pix' }),\n      goTransf: () => this.go('transfValor', 'Transferência. Digite o valor no teclado ou toque em um valor.', { val: '', led: 'green' }),\n      goMenu: () => this.go('menu', 'Cardápio de hoje. Toque em Ouvir cardápio para escutar.', { tab: 'hoje' }),\n      openMenuGuest: () => this.go('menu', 'Cardápio de hoje.', { tab: 'hoje' }),\n      tabToday: () => this.setState({ tab: 'hoje', audio: 'Cardápio de hoje.' }),\n      tabWeek: () => this.setState({ tab: 'semana', audio: 'Cardápio da semana.' }),\n      readMenu: () => this.setState({ audio: s.tab === 'hoje' ? 'Hoje, sexta: sobrecoxa de frango ao sugo. Vegetariano: bolinho de grão-de-bico. Vegano: feijão roxo ao vinagrete. Salpicão, arroz, feijão, saladas e melão de sobremesa.' : 'Semana: segunda linguiça de pernil, terça espetinho de frango, quarta feriado, quinta cubos suínos ao barbecue, sexta sobrecoxa de frango.' }),\n      back: () => { if (s.logged) this.home(); else this.go('espera', 'Encoste sua carteirinha no leitor.', { led: 'blue' }); },\n      goAvaliar: () => this.go('avaliar', 'Como estava o almoço? Dê uma nota de 1 a 5.', { rating: 0, led: 'green' }),\n      goFeedback: () => this.go('feedback', 'Escolha o assunto da sua sugestão.', { cat: '', mood: '' }),\n      setGood: () => this.setState({ mood: 'bom', err: '', audio: 'Está bom.' }),\n
